[package]
name = "photoproof-connectors"
description = "Connector trait boundaries: Transcriber, Embedder, LanguageModel, VectorStore, Reranker."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
futures-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
serde_ignored = "0.1"
toml = "0.8"
# `half` enables zero-length f16 past_key_values caches shaped from session
# metadata — the onnx-community causal-LM exports demand them (the spike's
# verified KV trap; docs/SPIKE-P7-EMBED.md). The pinned exports are f32, but
# shaping from metadata stays dtype-honest for either.
#
# `coreml` links a CoreML-EP-capable onnxruntime (the prebuilt onnxruntime
# `ort` downloads is NOT guaranteed to carry the CoreML EP; the feature pulls
# `ort-sys/coreml`). This is the PLAN-PERF P2 CoreML SPIKE: the EP is wired but
# OFF by default. The default (CPU) path is unchanged and does not require the
# CoreML EP to be functional at runtime — registration is gated on an env knob
# (`PHOTOPROOF_ORT_COREML`, see `ort_embedder::build_session`). WHY pin the
# version: the ort builder API for the CoreML EP drifts across rc tags
# (`with_ane_only` -> `with_compute_units`, `with_subgraphs(bool)`), so the
# exact rc this was written against is load-bearing.
ort = { version = "2.0.0-rc.12", features = ["half", "coreml"] }
half = "2"
# tokenizer.json loading for the in-process ort embedders (EmbeddingGemma /
# Qwen3 / DFN5B textual). default-features off: we only deserialize a
# pretrained tokenizer.json, never train, so the heavy training/http deps
# stay out of the build.
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }

[dev-dependencies]
pollster = "0.4"
# Image decode for the CoreML SPIKE measurement harness (the #[ignore]
# `coreml_spike_*` tests decode real COCO JPEGs through the CLIP visual tower
# to measure CPU vs CoreML img/s + embedding accuracy). dev-only: the shipped
# connector takes an already-decoded DecodedImage from core, so this never
# enters the production build.
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }

[features]
# NVIDIA GPU path (the Ryzen 9900X + RTX 5080 "margo" desktop). Split so the
# floor (CUDA, which only needs the CUDA toolkit) can be built + tested BEFORE
# TensorRT (which also needs the TensorRT libs installed). OFF by default - the
# macOS/CoreML + CPU builds never link CUDA/TensorRT. Built ONLY on the NVIDIA
# machine. The same single-file FP16 model that CoreML validated serves both EPs.
cuda = ["ort/cuda"]
tensorrt = ["ort/tensorrt", "cuda"]
nvidia = ["tensorrt"]
# Load a SYSTEM onnxruntime at runtime (via ORT_DYLIB_PATH) instead of ort's
# prebuilt binary. Needed for bleeding-edge GPUs: the RTX 5080 (Blackwell sm_120)
# is newer than ort's prebuilt onnxruntime kernels (they top out at sm_90 Hopper),
# so we point ORT_DYLIB_PATH at an official onnxruntime-gpu (1.21+) that ships
# sm_120. The CUDA/TensorRT EP *types* come from the cuda/tensorrt features; the
# actual binary + provider .so's come from the dylib.
cuda-dynamic = ["tensorrt", "ort/load-dynamic"]
