[package]
name = "photoproof-core"
description = "Photoproof core: event log, library, sidecars, search. No UI dependencies."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
blake3.workspace = true
ulid.workspace = true
rusqlite = { workspace = true, features = ["trace"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
# --- sidecar deps (owned by packet P2.1; append below this line only) ---
# --- library deps (owned by packet P2.2; append below this line only) ---
# --- search deps (owned by packet P3.1; append below this line only) ---
# Foreign editor sidecar reader (foreign_sidecar.rs): a tiny, pure-Rust XMP/RDF
# reader for the read-only portable subset of Lightroom/darktable edits. We
# deliberately avoid a heavy XML stack (no serde-xml, no DOM). With default
# features off, quick-xml pulls only `memchr` (already in the tree via blake3),
# so this stays a lightweight, read-only parse seam.
quick-xml = { version = "0.40", default-features = false }
rayon = "1.12.0"
notify = "8.2.0"
walkdir = "2.5.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "tiff", "webp", "rayon"] }
webp = "0.3.1"
kamadak-exif = "0.6.1"
rawler = "0.7.2"
qcms = "0.3.0"
fastrand = "2.4.1"
libc = "0.2.186"
# --- capture deps (owned by packet P6.1; append below this line only) ---
photoproof-connectors = { path = "../photoproof-connectors" }
futures-core.workspace = true
# --- runtime deps (owned by packet P6.2; append below this line only) ---
# SHA-256 for the manifest's pinned-checksum verification (RUNTIME §5.1;
# image identity stays BLAKE3 — download pins follow Hugging Face convention).
sha2 = "0.10"
ureq = "3"
# --- retrieval deps (owned by packet P7.1; append below this line only) ---
# Minimal block_on for the async Embedder seam: the embedding drain runs on
# a background thread and model IO is one call at a time (GPU concurrency 1,
# LIBRARY §10.3), so a full async runtime would be dead weight here.
pollster = "0.4"
# §1.3 read path: the brute-force scan is memory-mapped, never a per-query
# heap copy of the whole space.
memmap2 = "0.9"
# --- retrieval deps (owned by packet P7.2; append below this line only) ---
# §10.3 collection-name resolution is normatively Jaro-Winkler at a 0.80
# threshold; strsim is the standard tiny implementation of exactly that.
strsim = "0.11"

[[bin]]
# Scriptable stub child for runtime-supervision tests (RUNTIME §8 /
# BUILD-LOOP honest-scope: supervision is verified against stub child
# processes). Dev/test fixture — never shipped; the installer bundles the
# desktop app only.
name = "photoproof-stub-child"
path = "src/bin/stub_child.rs"

[[bin]]
# The M3 golden-query retrieval-quality gate runner (RETRIEVAL §12). Loads a
# golden query set + a populated library DB, runs each query through the
# hybrid rig, and scores P@k/R@k/MRR/nDCG so the founder can sweep
# FusionWeights and read the metric deltas (settles B69 S4 weight + the
# reranker go/no-go). Founder-machine tool: needs a real DB + query set, so
# it is NOT a CI test (the CI proof is the retrieval_eval_sample test).
# Explicit [[bin]] only to spell the name with hyphens (pp-retrieval-eval).
name = "pp-retrieval-eval"
path = "src/bin/pp_retrieval_eval.rs"

[dev-dependencies]
tempfile.workspace = true
rusqlite = { workspace = true, features = ["trace"] }
serde_json.workspace = true
rand = "0.8"
# --- sidecar dev-deps (owned by packet P2.1; append below this line only) ---
# --- library dev-deps (owned by packet P2.2; append below this line only) ---
# --- search dev-deps (owned by packet P3.1; append below this line only) ---
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "tiff", "webp"] }
