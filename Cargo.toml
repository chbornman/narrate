[workspace]
resolver = "2"
members = [
    "crates/photoproof-core",
    "crates/photoproof-connectors",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
repository = "https://github.com/chbornman/narrate"

# Dev builds: optimize dependencies (image/webp/raw decode is 10-50x slower
# unoptimized — preview generation must be usable under `cargo tauri dev`).
# Workspace members stay at opt-level 0 for debuggability.
[profile.dev.package."*"]
opt-level = 2

[workspace.dependencies]
blake3 = { version = "1", features = ["mmap", "rayon"] }
ulid = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
futures-core = "0.3"
tempfile = "3"
# Structured logging facade (BACKLOG metrics suite, first slice): core
# emits spans/events; only the desktop shell installs a subscriber.
tracing = "0.1"
