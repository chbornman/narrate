[package]
name = "photoproof-desktop"
description = "Photoproof desktop shell: Tauri 2 command layer over photoproof-core."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "photoproof_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
photoproof-core = { path = "../../../crates/photoproof-core" }
photoproof-connectors = { path = "../../../crates/photoproof-connectors" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# Single-instance discipline (RUNTIME §8.5): the plugin forwards a second
# launch's focus to the first instance; the core's instance.lock is the
# belt-and-braces half supervisors check before any spawn.
tauri-plugin-single-instance = "2"
# Hardware-tier detection (RUNTIME §6.1): adapter enumeration via wgpu;
# byte-accurate VRAM via the native layer (ash/Vulkan on Linux; DXGI and
# Metal paths are cfg-gated, founder/CI-verified). No shaders, no surface:
# enumeration only.
wgpu = { version = "29", default-features = false, features = ["std", "vulkan", "metal", "dx12"] }
# Tiny executor for wgpu 29's async enumerate_adapters (probe-time only).
pollster = "0.4"
# Window geometry persistence (featureset §6) — new dependency, flagged:
# named as INTEGRATION's to add in UI-ARCHITECTURE §5/Appendix A. Wayland
# restore-drift risk is tracked in DOGFOOD §visual; the manual fallback
# path (commands/app.rs) is named in lib.rs beside the registration.
tauri-plugin-window-state = "2"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
rusqlite = { workspace = true }
blake3 = { workspace = true }
ulid = { workspace = true }
http = "1"
tracing.workspace = true
# The one subscriber install (lib.rs run()); core stays facade-only.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_os = "linux")'.dependencies]
ash = "0.38"

[target.'cfg(target_os = "macos")'.dependencies]
# hardware.rs §6.1.2: sysctlbyname(hw.memsize) for the unified-memory gate.
libc = "0.2.186"
# Tab lights-out (featureset §0): commands/app.rs hides the NATIVE traffic
# lights (standardWindowButton:setHidden:) — they are NSButtons the DOM
# region gates can't reach. Already in-tree transitively via tauri/wry.
objc2 = "0.6"

[dev-dependencies]
tempfile = { workspace = true }
futures-core = { workspace = true }
# MockRuntime for command-level event-emission tests (roots-changed):
# dev-only feature; release binaries are unaffected.
tauri = { version = "2", features = ["test"] }
# protocol.rs /embedded tests: scripted extractor previews in, decoded
# response bytes out (resolves to photoproof-core's pinned version).
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }

[features]
# The debug side panel (spec/UI.md §10, DECISIONS I6): its commands and event
# emitters do not exist in release binaries. Pair with the frontend
# PHOTOPROOF_DEBUG=1 compile-time define.
debug-panel = []
# Tauri convention: enabled by `cargo tauri build` for bundled apps.
custom-protocol = ["tauri/custom-protocol"]
