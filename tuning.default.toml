# PhotoProof tuning config — REFERENCE (the shipped defaults).
#
# This file documents the default values. It is NOT read at runtime: the LIVE
# config lives in app-data at
#
#     ~/Library/Application Support/com.photoproof.desktop/tuning.toml
#
# (created/edited by hand — no copy is shipped, so a missing file means pure
# code defaults). Copy any section you want to override into that path, restart
# the app, and re-feel. Every field is optional: a partial file merges over
# these defaults (so you can set just `[search].rrf_k` and leave the rest).
#
# Out-of-range values are rejected back to the default with a logged warning
# (see logs/photoproof.log) — a typo can never inject a silent bad number.
#
# Source of truth is the Rust `Tuning` struct in
# `crates/photoproof-core/src/tuning.rs`; the human view is `docs/tuning.html`.
# If you change a default in code, update this file and tuning.html in lockstep.

# ---------------------------------------------------------------------------
# Search — hybrid-fusion ranking (RETRIEVAL §5.3). Owned by the §12 golden-set
# eval (data-driven), not magic constants. `pp-retrieval-eval` reads THIS file.
# ---------------------------------------------------------------------------
[search]
# RRF rank constant k: contribution = weight / (k + rank). Range [1, 10000].
rrf_k = 60.0
# Dense-signal similarity tilt β: a dense signal's per-image contribution is
# multiplied by (1 + β·(2·cos − 1)), spanning [1−β, 1+β]. Range [0, 1].
beta = 0.5

[search.fusion]
# Per-signal fusion weights. Non-negative multipliers, range [0, 1000].
s1 = 1.0       # S1 annotation_chunk vectors — your own words (primary)
s2 = 1.0       # S2 event_fts — note keyword FTS
s3_each = 0.5  # each S3 sub-list — derived summaries (never outvote your words)
s4 = 1.0       # S4 image_clip — visual match (B69: raised 0.5→1.0)

# ---------------------------------------------------------------------------
# Preview — display/embedded-preview sizing (LIBRARY §9). Pixel edges, range
# [256, 16384].
# ---------------------------------------------------------------------------
[preview]
display_edge = 2560          # display-tier preview longest edge, px
embedded_accept_edge = 2048  # in-RAW JPEG is "good enough" at >= this px

# ---------------------------------------------------------------------------
# Dedup — Tier-1 near-duplicate detection (DESIGN-DEDUP-AND-SIMILARITY.md
# §"Tier 1"). The Hamming-distance cutoff for "is this the SAME photo" over the
# 64-bit dHash perceptual hash. The design doc is explicit: this MUST be
# calibrated empirically on real libraries (the textbook normal-distribution
# assumption was refuted) — 8 is a STARTING point in the doc's "≈ ≤6-10 / 64"
# band, not a settled value. Lower = stricter (fewer, tighter groups); higher =
# looser. Range [0, 64].
# ---------------------------------------------------------------------------
[dedup]
hamming_threshold = 8  # max differing bits (of 64) to count as the same photo

# ---------------------------------------------------------------------------
# Graph — semantic topic-graph force lens (DESIGN-SEMANTIC-GRAPH.md). The
# force-directed lens' physics + the looks/said blend default. Tuned by feel:
# alpha_default also gates topic_affinities when a caller passes no alpha.
# ---------------------------------------------------------------------------
[graph]
alpha_default = 0.5   # looks vs said blend: 0 = annotation only, 1 = visual only. Range [0, 1].
attraction = 0.02     # pull stiffness toward a topic anchor (× blended affinity). Range [0, 100000].
repulsion = 800.0     # mutual image-image repulsion (spreads clusters). Range [0, 100000].
damping = 0.85        # per-step velocity damping (the sim's cooling). Range [0, 1].
centering = 0.01      # pull toward the origin (un-topic'd images drift to center). Range [0, 100000].
ring_radius = 320.0   # topic-anchor ring radius (the INITIAL anchor layout). Range [0, 100000].
# Force-placed anchors (founder dogfood): the ring is only the start. Each anchor
# is pulled toward its images' affinity-weighted centroid (so related topics drift
# together) with mutual anchor repulsion (so they don't collapse). Draggable +
# pinnable in the UI; double-click a pinned anchor to release it.
anchor_attraction = 0.08    # anchor pull toward its images' centroid. Range [0, 100000].
anchor_repulsion = 60000.0  # mutual anchor-anchor repulsion (keeps topics spread). Range [0, 100000].
anchor_damping = 0.8        # per-step damping for the anchors' own motion. Range [0, 1].
# v2 cluster auto-labels (cluster_topics k-means): k = clamp(round(sqrt(n/2)), k_min, k_max).
cluster_k_min = 2     # minimum cluster count. Range [1, 64].
cluster_k_max = 12    # maximum cluster count (caps the suggestion rail width). Range [1, 64].
# v2 full-library LOD: aggregate images into super-nodes past this node count.
lod_threshold = 1500  # node count past which the lens aggregates into super-nodes. Range [50, 1000000].

# Diversify — duplication-tolerance "hide-for-variety" slider
# (DESIGN-DEDUP-AND-SIMILARITY.md). The single tolerance [0,1] maps to a cosine
# similarity CUTOFF (and, for the MMR objective, a lambda) through these
# endpoints. The slider drives greedy facility-location over the CLIP k-NN graph
# by default. Calibrate the cutoffs on real libraries (thresholds are starting
# points, not findings).
# ---------------------------------------------------------------------------
[diversify]
cutoff_high = 1.0    # cutoff at tolerance 0: only near-identical collapses ⇒ slider-at-zero shows everything. Range [0, 1].
cutoff_low = 0.55    # cutoff at tolerance 1: even loosely-similar frames collapse. Range [0, 1].
lambda_floor = 0.3   # MMR lambda floor at tolerance 1 (residual quality pull at max diversity). Range [0, 1].
knn_k = 12           # k-NN neighbors per image requested from knn_within to seed the sparse graph. Range [1, 256].

# Heatmap — attention/engagement intensity (DESIGN-ATTENTION-HEATMAP.md). NOT a
# gaze tracker: it scores where you put intent (what you opened/marked/said),
# capped and local. Dwell leads; stroke-count is a small factor. The tier rates
# and the cap live here so "how much grid-select counts vs a Look-open" is
# re-feel-able without a rebuild.
# ---------------------------------------------------------------------------
[heatmap]
# Composite: intensity = w_dwell*dwell_ms + w_events*event_count + w_strokes*stroke_count,
# then normalized 0..1 across the scope. Non-negative weights, range [0, 1000].
w_dwell = 0.0001  # dwell-ms weight (small unit; 60 s capped dwell ~= 6 raw)
w_events = 1.0    # live event_count weight
w_strokes = 0.5   # extra nudge per live stroke (a bare count is enough)
# Dwell tiers: fraction of raw elapsed credited per focus episode, range (0, 1].
# Look-open is full weight; grid select/multiselect counts far less.
dwell_look_rate = 1.0
dwell_grid_rate = 0.15
# Per-episode-per-image dwell cap, ms (60 s). With the window-blur pause this
# handles the walk-away case. Range [0, 86400000].
dwell_cap_ms = 60000
# Recency decay half-life, days: in the default (recency-weighted) mode an
# image's intensity is multiplied by 0.5^(age_days / half_life). The UI
# "All-time" toggle turns the decay OFF (flat). Range (0, 365].
recency_half_life_days = 14.0

# ---------------------------------------------------------------------------
# Voice — endpoint/VAD feel dials (DESIGN-TUNING-LOOP.md "voice" arm). How snappy
# a final lands after you stop talking (the endpoint rules), how eager the gate
# opens/closes (the silero hysteresis), and how much cold-start audio is replayed
# (the pre-roll). These are FEEL knobs swept by `pp-sweep voice` over the voice
# corpus, ranked by gating-cost (gated WER - raw WER). Lifted out of
# pp-asr-server / silero / capture-engine consts so a swept winner is a file the
# app reads. The launcher passes rule1/2/3 to pp-asr-server; the shell builds the
# silero VAD from enter/exit/hang; the capture engine reads pre_roll_ms.
# ---------------------------------------------------------------------------
[voice]
# Endpoint rules (CAPTURE §6.3), trailing-silence / utterance-length SECONDS.
# Range [0.1, 60]. rule2 is THE snappiness dial (lower = a faster final after you
# stop, at the risk of clipping a trailing word).
rule1 = 2.4   # trailing silence with NOTHING decoded yet (dead-air endpoint)
rule2 = 1.2   # trailing silence AFTER decoded speech (the felt post-utterance latency)
rule3 = 20.0  # utterance length that forces an endpoint regardless of silence
# silero VAD hysteresis. enter/exit are speech-probabilities, range [0, 1]
# (0 forces the gate open — the RAW WER ceiling pass). hang is below-EXIT windows
# (32 ms each) before SpeechEnd: 15 = 480 ms. Range [1, 300].
vad_enter = 0.5   # open the gate at this speech-probability
vad_exit = 0.35   # close the gate below this (for hang windows)
vad_hang = 15     # below-EXIT windows before the gate closes
# Pre-roll (CAPTURE §6.2), ms: withheld silence-gated audio replayed when
# shipping resumes, so a cold-start first word is not chopped. 0 disables it.
# Range [0, 5000].
pre_roll_ms = 1000

# FIXED contracts (deliberately NOT here — a config edit must never silently
# break an invariant): the <100 ms search latency budget, the embedded aspect
# tolerance (0.02) that protects stroke geometry, and the VOICE timing contracts
# (the onset error budget, the association skew bound, the drain + trailing-ship
# windows in capture/engine.rs). See tuning.html.
